# /root/smart-locker/nginx/conf.d/247panel.conf
#
# Mirrors 247box.conf in the same directory. Installed by deploy/setup-247panel.sh,
# which issues the certificate first — nginx will not start if the ssl_certificate
# paths below do not exist yet.

# HTTP: ACME challenge + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 247panel.ekzomap.mn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 247panel.ekzomap.mn;

    ssl_certificate     /etc/letsencrypt/live/247panel.ekzomap.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/247panel.ekzomap.mn/privkey.pem;
    # Same inlined TLS settings as 247box.conf — ECDHE-only, so no ssl_dhparam.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Docker's embedded DNS. Resolving through a variable makes nginx re-resolve at
    # request time, so rebuilding the panel container (new IP) can't strand it on a
    # stale address and 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream     http://247panel:3000;
    set $upstream_api http://app:3030;

    client_max_body_size 20m;

    # Same-origin API proxy. Build the panel with NEXT_PUBLIC_API_URL=/api to use it —
    # requests then never leave this origin, so the backend CORS whitelist and
    # cross-site cookie rules stop mattering. Leave it unused and it costs nothing.
    # rewrite ... break is required because proxy_pass with a variable ignores a URI part.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # No websocket handling needed — a production Next.js server has no HMR socket,
    # and /_next/static already ships its own immutable Cache-Control.
    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
