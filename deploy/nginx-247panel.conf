# /etc/nginx/sites-available/247panel.ekzomap.mn
# Next.js panel served on 127.0.0.1:3000, proxied by nginx.
#
# Install:
#   sudo cp deploy/nginx-247panel.conf /etc/nginx/sites-available/247panel.ekzomap.mn
#   sudo ln -s /etc/nginx/sites-available/247panel.ekzomap.mn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 247panel.ekzomap.mn
#
# Run certbot AFTER the port 80 block is live. Certbot rewrites this file to add
# the ssl_certificate lines and the http -> https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name 247panel.ekzomap.mn;

    # Let certbot answer the ACME challenge over plain http.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js build assets are content-hashed and immutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 20M;
}
