# Bootstrap vhost — HTTP only, no SSL directives.
#
# Goes into /root/smart-locker/nginx/conf.d/247panel.conf *before* the certificate
# exists. nginx refuses to start if ssl_certificate points at a missing file, so the
# real vhost cannot be installed until certbot has issued the cert. This block only
# serves the ACME challenge; setup-247panel.sh swaps in nginx-247panel.conf after.

server {
    listen 80;
    listen [::]:80;
    server_name 247panel.ekzomap.mn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
