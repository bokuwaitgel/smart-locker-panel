services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only. NEXT_PUBLIC_* is inlined into the client bundle, so
        # passing it as a runtime `environment:` entry has no effect. Change this
        # -> rebuild (`docker compose up -d --build`).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://247box.ekzomap.mn}
    image: 247panel:latest
    container_name: 247panel
    restart: unless-stopped
    # Loopback only, for debugging from the host. Public traffic arrives through
    # the smart-locker nginx container, which reaches this over the shared network.
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Next's standalone server binds process.env.HOSTNAME. The Dockerfile ENV
      # already wins over Docker's injected container hostname, but pin it here too
      # so the bind address stays obvious and survives a Dockerfile edit.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks:
      default:
      smart-locker:
        aliases:
          - 247panel

networks:
  default:
  # The nginx + certbot stack in /root/smart-locker. nginx proxies to
  # http://247panel:3000 over this network — it cannot use 127.0.0.1, which
  # inside that container is nginx's own loopback.
  smart-locker:
    external: true
    name: smart-locker_default
